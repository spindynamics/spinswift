name: SwiftOnLinux
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt install -y libgsl-dev
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: apt install -y libgsl-dev uv
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: uv sync && source .venv/bin/activate && swift test

      


