name: SwiftOnMac-dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:

    runs-on: macos-26

    steps:
      - name: install dependencies
        run: brew install gsl uv
      - uses: actions/checkout@v5
      - uses: SwiftyLab/setup-swift@latest
      - name: Build
        run: swift build
      - name: Run tests
        run: |
          uv sync
          ls -alF
          source .venv/bin/activate
          swift test

