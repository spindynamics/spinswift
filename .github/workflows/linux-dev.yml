name: SwiftOnLinux-dev
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt install -y libgsl-dev
          pip install uv
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: |
          uv sync
          ls -alF
          source .venv/bin/activate
          swift test
